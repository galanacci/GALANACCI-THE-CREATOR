name: Update desktop number

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-desktop-number:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Increment desktop number
        shell: bash
        run: |
          file="index.html"
          current=$(grep -oE 'VERSION_[0-9]+' "$file" | head -1 | sed 's/[^0-9]//g')

          if [[ -z "$current" ]]; then
            echo "Could not find a VERSION number in $file" >&2
            exit 1
          fi

          next=$((10#$current + 1))
          printf -v padded "%03d" "$next"
          sed -i -E "s/VERSION_[0-9]+/VERSION_${padded}/g" "$file"

      - name: Commit updated desktop number
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Desktop number is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: update desktop number [skip ci]"
          git push
