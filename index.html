<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="GALANACCI THE CREATOR — archive, experiments, brands and worlds.">
  <title>GALANACCI THE CREATOR</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <main id="gtc-desktop" class="desktop" aria-label="GALANACCI THE CREATOR desktop">
    <div id="desktop-apps" class="desktop-apps" aria-label="Desktop applications"></div>

    <p id="desktop-hint" class="desktop-hint" aria-hidden="true"></p>

    <div class="desktop-meta" aria-hidden="true">
      <span>GALANACCI THE CREATOR</span>
      <span>DESKTOP_008</span>
    </div>
  </main>

  <section id="folder-window" class="folder-window" hidden aria-hidden="true" role="dialog" aria-labelledby="folder-window-title">
    <header class="folder-window__chrome">
      <span id="folder-window-title">EXPERIMENTS</span>
      <button type="button" class="folder-window__close" data-close-folder aria-label="Close folder">&times;</button>
    </header>
    <div class="folder-window__body">
      <a class="folder-item" href="./experiments/2(XY-T)/" aria-label="Open 2(XY-T) experiment">
        <img src="assets/icons/XY-T.EXE.svg" alt="">
        <span>2(XY-T)</span>
      </a>
    </div>
  </section>

  <section id="launch-transition" class="launch-transition" hidden aria-hidden="true">
    <div class="launch-transition__inner">
      <p id="launch-label">OPENING...</p>
      <span class="launch-transition__track" aria-hidden="true">
        <span class="launch-transition__bar"></span>
      </span>
    </div>
  </section>

  <script type="module" src="js/apps.js"></script>
  <script type="module" src="js/desktop.js"></script>
</body>
</html>
