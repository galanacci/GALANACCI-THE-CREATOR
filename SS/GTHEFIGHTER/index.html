<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>GTHEFIGHTER.EXE</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css?v=artwork-slider-v1">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js",
        "three/addons/": "./vendor/"
      }
    }
  </script>
  <link rel="stylesheet" href="./gthefighter-ui-fix.css?v=gthefighter-ui-fix-v1">
</head>
<body>
  <main class="experience" aria-label="G THE FIGHTER interactive digital frame">
    <canvas
      id="frame-viewer"
      tabindex="0"
      aria-label="Interactive digital frame. Drag to rotate and scroll or pinch to zoom."
    ></canvas>

    <header class="identity" aria-label="Artwork title">
      <p>GALANACCI PRESENTS</p>
      <h1>G THE FIGHTER</h1>
    </header>

    <section class="collection-info" aria-label="Collection information">
      <div>
        <span>CREATED</span>
        <strong>2021</strong>
      </div>
      <div>
        <span>CREATOR</span>
        <strong>GALANACCI</strong>
      </div>
      <p>A DIGITAL ART COLLECTION EXPLORING BOXING'S GREATS.</p>
    </section>

    <p class="interaction-hint" aria-hidden="true">
      <span class="interaction-hint__desktop">DRAG TO ROTATE / SCROLL TO ZOOM</span>
      <span class="interaction-hint__touch">SWIPE TO ROTATE / PINCH TO ZOOM</span>
    </p>

    <button id="reset-view" class="reset-view" type="button">RESET VIEW</button>

    <section id="artwork-scrubber" class="artwork-scrubber" aria-label="Artwork navigation">
      <input
        id="artwork-slider"
        class="artwork-scrubber__range"
        type="range"
        min="1"
        max="60"
        value="1"
        step="1"
        aria-label="Browse projected artworks"
      >
      <div class="artwork-scrubber__meta" aria-live="polite">
        <span id="artwork-current">001</span>
        <span class="artwork-scrubber__divider">/</span>
        <span id="artwork-total">060</span>
      </div>
    </section>

    <div id="loading-state" class="loading-state" role="status" aria-live="polite">
      <div class="loading-state__track" aria-hidden="true">
        <span id="loading-progress"></span>
      </div>
      <p>LOADING DIGITAL FRAME <span id="loading-percentage">000%</span></p>
    </div>

    <div id="webgl-fallback" class="webgl-fallback" hidden>
      <img src="./assets/digital-frame-reference.jpg" alt="Rendered G THE FIGHTER digital frame">
      <p>3D VIEWER UNAVAILABLE ON THIS DEVICE</p>
    </div>
    <video
      id="fighter-video"
      src="./assets/fighter-artwork.mp4"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="auto"
      crossorigin="anonymous"
      aria-hidden="true"
    ></video>
  </main>

  <script type="module" src="./app.js?v=artwork-slider-v1"></script>
</body>
</html>
