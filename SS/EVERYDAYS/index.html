<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>EVERYDAYS.EXE</title>
  <link rel="stylesheet" href="./everydays.css?v=1">
</head>
<body>
  <main id="mosaic" class="mosaic" aria-label="EVERYDAYS image archive">
    <div id="mosaic-grid" class="mosaic__grid" aria-live="polite"></div>
    <div id="preview" class="preview" aria-hidden="true">
      <img id="preview-image" alt="">
    </div>
    <section id="scrubber" class="scrubber" aria-label="Image navigation">
      <input
        id="image-slider"
        class="scrubber__range"
        type="range"
        min="1"
        max="1"
        value="1"
        step="1"
        aria-label="Browse EVERYDAYS images"
      >
      <div class="scrubber__meta" aria-live="polite">
        <span id="image-current">001</span>
        <span class="scrubber__divider">/</span>
        <span id="image-total">001</span>
      </div>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="./everydays.js?v=ss-slider-nav-v1"></script>
</body>
</html>
