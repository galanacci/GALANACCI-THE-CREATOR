<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIBONACCI.EXE</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }
        #fibonacci-container {
            width: 100%;
            height: 100%;
            cursor: default;
        }
        #palette-control {
            position: fixed;
            z-index: 10;
            top: 12px;
            left: 12px;
            font: 11px/1.2 Arial, sans-serif;
            letter-spacing: 0.12em;
        }
        #palette-control[hidden] { display: none; }
        #palette-button,
        .palette-option {
            min-height: 44px;
            border: 1px solid rgba(255, 255, 255, 0.34);
            background: rgba(0, 0, 0, 0.82);
            color: #fff;
            cursor: pointer;
            font: inherit;
            letter-spacing: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        #palette-button {
            min-width: 92px;
            padding: 0 12px;
            text-align: left;
        }
        #palette-button::after {
            content: '⌄';
            float: right;
            margin-left: 10px;
        }
        #palette-options {
            display: grid;
            gap: 4px;
            margin-top: 4px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.34);
            background: #080808;
        }
        #palette-options[hidden] { display: none; }
        .palette-option {
            min-width: 132px;
            padding: 0 12px;
            text-align: left;
        }
        .palette-option[aria-pressed="true"] {
            border-color: #f2d8b7;
            color: #f2d8b7;
        }
        #palette-button:hover,
        .palette-option:hover,
        #palette-button:focus-visible,
        .palette-option:focus-visible {
            color: #f2d8b7;
        }
        #palette-button:focus-visible,
        .palette-option:focus-visible {
            outline: 2px solid #f2d8b7;
            outline-offset: 2px;
        }
        #microphone-status {
            position: fixed;
            right: 72px;
            bottom: max(18px, env(safe-area-inset-bottom));
            left: 72px;
            color: rgba(255, 255, 255, 0.68);
            font: 12px/1.5 Arial, sans-serif;
            letter-spacing: 0.12em;
            text-align: center;
            pointer-events: none;
        }
        #fullscreen-button {
            position: fixed;
            right: 12px;
            bottom: max(12px, env(safe-area-inset-bottom));
            z-index: 10;
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            padding: 0;
            border: 0;
            background: rgba(0, 0, 0, 0.35);
            color: #fff;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        #fullscreen-button svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            pointer-events: none;
        }
        #fullscreen-button[aria-pressed="true"] .icon-enter,
        #fullscreen-button[aria-pressed="false"] .icon-exit {
            display: none;
        }
        #fullscreen-button:hover,
        #fullscreen-button:focus-visible {
            color: #f2d8b7;
        }
        #fullscreen-button:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: -2px;
        }
    </style>
</head>
<body>
    <script>
        // Prevent default touch behaviors
        document.addEventListener('touchmove', function(event) {
            if (event.scale !== 1) {
                event.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('gesturestart', function(event) {
            event.preventDefault();
        });

        // Prevent zooming on double tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            // Keep native button activation intact on touch devices.
            if (event.target instanceof Element && event.target.closest('button')) {
                lastTouchEnd = 0;
                return;
            }
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
    <svg id="fibonacci-container"><g id="fibonacci-dots"></g></svg>
    <div id="palette-control">
        <button id="palette-button" type="button" aria-expanded="false" aria-controls="palette-options">COLOUR</button>
        <div id="palette-options" hidden>
            <button class="palette-option" type="button" data-palette="mono" aria-pressed="true">MONO</button>
            <button class="palette-option" type="button" data-palette="cream" aria-pressed="false">CREAM</button>
            <button class="palette-option" type="button" data-palette="violet" aria-pressed="false">VIOLET</button>
            <button class="palette-option" type="button" data-palette="prism" aria-pressed="false">PRISM</button>
        </div>
    </div>
    <div id="microphone-status" role="status" aria-live="polite"></div>
    <button id="fullscreen-button" type="button" aria-label="Enter fullscreen" aria-pressed="false" title="Enter fullscreen" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="icon-enter" d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6" />
            <path class="icon-exit" d="M3 9h6V3m12 6h-6V3M3 15h6v6m12-6h-6v6" />
        </svg>
    </button>
    <script src="script.js"></script>
</body>
</html>
