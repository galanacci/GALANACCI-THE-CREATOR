<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>EXPERIMENTS - GALANACCI THE CREATOR</title>
  <style>
    :root { color-scheme: dark; --bg: #000; --fg: #ead1b2; --muted: rgba(234, 209, 178, .62); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font-family: Georgia, serif; }
    main { width: min(720px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 48px; }
    a { color: inherit; }
    .back { display: inline-block; margin-bottom: 64px; font: 600 11px/1.4 monospace; letter-spacing: .12em; text-decoration: none; }
    h1 { margin: 0 0 40px; font-size: clamp(32px, 8vw, 64px); font-weight: 400; letter-spacing: .02em; }
    .app { display: grid; grid-template-columns: 88px 1fr; gap: 24px; align-items: center; border-top: 1px solid rgba(234, 209, 178, .18); padding-top: 24px; }
    .app img { width: 88px; height: 88px; }
    .app h2 { margin: 0 0 8px; font-size: 22px; font-weight: 500; }
    .app p { margin: 0 0 14px; color: var(--muted); font: 12px/1.6 monospace; }
    .app a { font: 600 11px/1.4 monospace; letter-spacing: .1em; text-decoration: none; }
    @media (max-width: 520px) { main { width: min(100% - 28px, 720px); } .back { margin-bottom: 48px; } .app { grid-template-columns: 72px 1fr; gap: 16px; } .app img { width: 72px; height: 72px; } }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../">&larr; BACK TO DESKTOP</a>
    <h1>EXPERIMENTS</h1>
    <article class="app">
      <img src="../assets/icons/XY-T.EXE.svg" alt="">
      <div>

        <a href="./2(XY-T)/README.md">OPEN PROJECT NOTES &rarr;</a>
      </div>
    </article>
  </main>
</body>
</html>
