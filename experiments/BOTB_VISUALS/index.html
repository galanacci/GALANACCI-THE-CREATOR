<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>BOTB_VISUALS.EXE — GALANACCI</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <script>
    if (window.self === window.top) location.replace('../../?app=botb_visuals');
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { color: #fff; font: 11px/1.5 monospace; }
    #stage { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }
    .sun { display: block; width: 100%; height: 100%; }
    .visual-picker { position: fixed; top: 16px; right: 16px; transition: opacity .25s; }
    .visual-picker select { min-height: 44px; max-width: calc(100vw - 32px); padding: 0 34px 0 14px;
      border: 1px solid #ead1b2b8; border-radius: 0; background: #12080ce6; color: #ead1b2;
      font: 700 11px Arial, sans-serif; letter-spacing: .08em; cursor: pointer; }
    .visual-picker select:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    :fullscreen body.presenting .visual-picker { opacity: 0; pointer-events: none; }
    .toolbar { position: fixed; right: 16px; bottom: 16px; display: flex; align-items: center;
      justify-content: flex-end; transition: opacity .25s; }
    .toolbar.hidden { opacity: 0; pointer-events: none; }
    .name { letter-spacing: .09em; color: #aaa; }
    .name span { display: block; color: #666; font-size: 10px; margin-top: 3px; }
    button { display: grid; place-items: center; width: 48px; height: 48px; padding: 0;
      border: 0; background: transparent; color: #ead1b2b8; cursor: pointer; }
    button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; }
    button[aria-pressed="true"] .icon-enter, button[aria-pressed="false"] .icon-exit { display: none; }
    button:hover, button:focus-visible { color: #f2d8b7; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    body.presenting { cursor: none; }
    @media (max-width: 450px) { .toolbar { left: 12px; right: 12px; bottom: 12px; } }
  </style>
</head>
<body>
  <main id="stage" aria-label="Visual 01: a yellow to red gradient sun against black">
    <canvas class="sun" role="img" aria-label="Animated gradient sun with travelling heat ripples"></canvas>
  </main>
  <nav class="visual-picker" aria-label="Choose performance visual">
    <select id="visual-select" aria-label="Visual">
      <option value="sun">01 / GRADIENT SUN</option>
      <option value="gradient">02 / SOFT GRADIENT</option>
      <option value="ring">03 / BOXING RING</option>
    </select>
  </nav>
  <nav class="toolbar" aria-label="Visual controls">
    <button id="present" type="button" aria-label="Enter fullscreen" aria-pressed="false" title="Enter fullscreen">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="icon-enter" d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6" />
        <path class="icon-exit" d="M3 9h6V3m12 6h-6V3M3 15h6v6m12-6h-6v6" />
      </svg>
    </button>
  </nav>
  <script>
    const canvas = document.querySelector('.sun');
    const ctx = canvas.getContext('2d');
    const selector = document.querySelector('#visual-select');
    let visual = 'sun';
    const ringImage = new Image();
    ringImage.src = './assets/boxing-ring-moving-lights.png';
    const ringFixtures = [[.09,.162],[.17,.22],[.326,.235],[.455,.232],
      [.543,.234],[.672,.235],[.83,.22],[.91,.16]];
    const field = document.createElement('canvas');
    const fieldCtx = field.getContext('2d');
    let fieldImage;
    const randomTarget = () => ({x: Math.random() * 1.3 - .15, y: Math.random() * 1.3 - .15});
    const clouds = [
      {color: [87,54,236], x: -.05, y: .5},
      {color: [124,156,226], x: .42, y: -.1},
      {color: [248,148,206], x: .42, y: .7},
      {color: [255,218,158], x: 1.05, y: .4},
      {color: [251,176,199], x: .7, y: 1.05}
    ].map(c => ({...c, from: {x:c.x,y:c.y}, to: randomTarget(), start: performance.now(), duration: 9000 + Math.random()*7000}));
    let width = 0, height = 0;
    function resize() {
      width = innerWidth; height = innerHeight;
      const ratio = visual === 'ring' ? Math.min(1, 1280 / width) : Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      field.width = 180;
      field.height = Math.min(260, Math.max(80, Math.round(180 * height / width)));
      fieldImage = fieldCtx.createImageData(field.width, field.height);
    }
    function drawSun(now) {
      const t = now / 1000;
      const radius = Math.min(width, height) * .38 * (1 + .018 * Math.sin(t * .52));
      ctx.clearRect(0, 0, width, height);
      const gradient = ctx.createLinearGradient(0, height / 2 - radius, 0, height / 2 + radius);
      [[0,'#ddce58'],[.3,'#e6ce73'],[.51,'#e6b46a'],[.74,'#e76b42'],[1,'#df2433']].forEach(([stop,color]) => gradient.addColorStop(stop,color));
      ctx.beginPath();
      for (let i = 0; i <= 512; i++) {
        const angle = i / 512 * Math.PI * 2;
        const wave = .0045 * Math.sin(angle * 13 - t * 3.8)
          + .00225 * Math.sin(angle * 23 + t * 5.2)
          + .001 * Math.sin(angle * 41 - t * 6.5);
        const r = radius * (1 + wave);
        const x = width / 2 + Math.cos(angle) * r;
        const y = height / 2 + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.shadowColor = '#d5733955';
      ctx.shadowBlur = radius * .045;
      ctx.fill();
      ctx.shadowBlur = 0;
      // Thin, translucent rims shear independently around the solid disc.
      // Their upward-moving interference gives the edge a refracted heat haze.
      ctx.save();
      ctx.strokeStyle = gradient;
      ctx.lineWidth = Math.max(1, radius * .007);
      ctx.filter = 'blur(' + Math.max(.6, radius * .003) + 'px)';
      for (let layer = -2; layer <= 2; layer++) {
        ctx.globalAlpha = .13 - Math.abs(layer) * .025;
        ctx.beginPath();
        for (let i = 0; i <= 512; i++) {
          const a = i / 512 * Math.PI * 2;
          const base = .0045 * Math.sin(a * 13 - t * 3.8)
            + .00225 * Math.sin(a * 23 + t * 5.2)
            + .001 * Math.sin(a * 41 - t * 6.5);
          const shimmer = Math.sin(a * 29 + Math.sin(a * 7 - t * 1.8) * 2 + t * 7 + layer * .8)
            * Math.sin(a * 9 - t * 2.6 + layer * .4);
          const r = radius * (1 + base + layer * .00675 + shimmer * .0135);
          const x = width / 2 + Math.cos(a) * r + Math.sin(a * 17 + t * 5) * radius * .0045;
          const y = height / 2 + Math.sin(a) * r;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      }
      ctx.restore();
    }
    function drawGradient(now) {
      for (const c of clouds) {
        let progress = Math.min(1, (now - c.start) / c.duration);
        const eased = progress * progress * (3 - 2 * progress);
        c.x = c.from.x + (c.to.x - c.from.x) * eased;
        c.y = c.from.y + (c.to.y - c.from.y) * eased;
        if (progress === 1) {
          c.from = {x:c.x, y:c.y}; c.to = randomTarget();
          c.start = now; c.duration = 9000 + Math.random() * 7000;
        }
      }
      const pixels = fieldImage.data;
      let index = 0;
      for (let y = 0; y < field.height; y++) {
        for (let x = 0; x < field.width; x++) {
          let total = 0, r = 0, g = 0, b = 0;
          for (const c of clouds) {
            const dx = x / field.width - c.x, dy = y / field.height - c.y;
            const weight = Math.exp(-(dx * dx + dy * dy) / .19);
            total += weight;
            r += c.color[0] * weight; g += c.color[1] * weight; b += c.color[2] * weight;
          }
          pixels[index++] = r / total; pixels[index++] = g / total;
          pixels[index++] = b / total; pixels[index++] = 255;
        }
      }
      fieldCtx.putImageData(fieldImage, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(field, 0, 0, width, height);
    }
    function drawRing(now) {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, width, height);
      if (!ringImage.complete || !ringImage.naturalWidth) return;
      const scale = Math.max(width / ringImage.naturalWidth, height / ringImage.naturalHeight);
      const w = ringImage.naturalWidth * scale, h = ringImage.naturalHeight * scale;
      const left = (width-w)/2;
      const top = (height-h)/2;
      ctx.drawImage(ringImage, left, top, w, h);
      const t = now / 1000;
      // Work in the photograph's coordinates so every fixture stays
      // registered to the ring at every viewport size.
      ctx.save();
      ctx.translate(left, top);
      ctx.scale(w, h);
      const spots = ringFixtures.map(([sourceX, sourceY], i) => ({
        x: .5 + .4*Math.sin(t*(.22+(i%4)*.018)+i*2.399),
        y: 1.12 + .12*Math.cos(t*.19+i*1.37),
        sourceX, sourceY
      }));
      ctx.globalCompositeOperation = 'screen';
      for (const spot of spots) {
        ctx.save();
        const beam = ctx.createLinearGradient(spot.sourceX,spot.sourceY,spot.x,spot.y);
        beam.addColorStop(0,'rgba(195,237,255,.19)');
        beam.addColorStop(.4,'rgba(145,214,245,.055)');
        beam.addColorStop(1,'rgba(150,220,250,.006)');
        ctx.fillStyle = beam;
        // Layered translucent cones soften the edges without expensive
        // full-height blur filters on every lamp and animation frame.
        ctx.globalAlpha = .34;
        for (const spread of [.076,.065,.054]) {
          ctx.beginPath();
          ctx.moveTo(spot.sourceX-.003,spot.sourceY);
          ctx.lineTo(spot.x-spread,spot.y);
          ctx.quadraticCurveTo(spot.x,spot.y+.035,spot.x+spread,spot.y);
          ctx.lineTo(spot.sourceX+.003,spot.sourceY);
          ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      }
      // Composite the foreground ring back over the full-length beams.
      // The ropes are individually masked, leaving their gaps transparent
      // so the spotlights remain visible in the arena behind them.
      ctx.globalCompositeOperation = 'source-over';
      ctx.beginPath();
      const polygon = points => {
        points.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
        ctx.closePath();
      };
      polygon([[0,.69],[.25,.625],[.75,.625],[1,.69],[1,1],[0,1]]);
      for (const rope of [
        [[0,.413],[.117,.456],[.25,.491],[.75,.491],[.883,.456],[1,.413]],
        [[0,.5],[.117,.514],[.25,.533],[.75,.533],[.883,.514],[1,.5]],
        [[0,.589],[.117,.586],[.25,.579],[.75,.579],[.883,.586],[1,.589]]
      ]) {
        polygon([...rope.map(([x,y])=>[x,y-.005]), ...rope.slice().reverse().map(([x,y])=>[x,y+.005])]);
      }
      ctx.rect(.244,.48,.028,.151);
      ctx.rect(.733,.48,.028,.151);
      ctx.rect(.11,.445,.015,.153);
      ctx.rect(.876,.445,.015,.153);
      ctx.rect(.498,.487,.009,.1);
      ctx.clip();
      ctx.drawImage(ringImage,0,0,1,1);
      ctx.restore();
    }
    selector.addEventListener('change', () => {
      visual = selector.value;
      resize();
      const label = {sun:'Animated gradient sun with travelling heat ripples', gradient:'Soft randomly shifting violet, blue, pink and peach gradient', ring:'HD boxing ring with a full bank of moving spotlights'}[visual];
      canvas.setAttribute('aria-label', label);
      document.querySelector('#stage').setAttribute('aria-label', label);
      selector.blur();
      reveal();
    });
    let previousGradientFrame = -Infinity;
    function drawFrame(now) {
      if (visual === 'sun') drawSun(now);
      else if (visual === 'ring') drawRing(now);
      else if (now - previousGradientFrame >= 33) {
        drawGradient(now); previousGradientFrame = now;
      }
      requestAnimationFrame(drawFrame);
    }
    addEventListener('resize', resize);
    resize();
    requestAnimationFrame(drawFrame);
    const toolbar = document.querySelector('.toolbar');
    const button = document.querySelector('#present');
    let timer;
    function reveal() {
      document.body.classList.remove('presenting');
      toolbar.classList.remove('hidden');
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (!toolbar.contains(document.activeElement) && document.activeElement !== selector) {
          toolbar.classList.add('hidden');
          document.body.classList.add('presenting');
        }
      }, 2500);
    }
    async function fullscreen() {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch {
        reveal();
      }
      button.blur();
      reveal();
    }
    button.addEventListener('click', fullscreen);
    document.addEventListener('fullscreenchange', () => {
      const expanded = !!document.fullscreenElement;
      const label = expanded ? 'Exit fullscreen' : 'Enter fullscreen';
      button.setAttribute('aria-label', label);
      button.setAttribute('aria-pressed', String(expanded));
      button.title = label;
    });
    document.addEventListener('pointermove', reveal);
    document.addEventListener('pointerdown', reveal);
    document.addEventListener('keydown', event => {
      reveal();
      if (event.key.toLowerCase() === 'f' && event.target.tagName !== 'BUTTON') fullscreen();
    });
    reveal();
  </script>
</body>
</html>
